name: Independent Redis UUID lookup research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP Redis extension
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-redis
      - name: Fetch pinned upstream source (read only)
        run: |
          mkdir -p build
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/MISP/MISP/04fc5f8b7ccb52bb6614ca3e9ccdbfdf6585d985/app/Model/Feed.php \
            -o build/upstream-Feed.php
          test "$(git hash-object build/upstream-Feed.php)" = 1f6a9d8ab8b197a366e549333736a321348d8ed7
      - name: Validate and build independent candidate
        run: |
          php -l benchmarks/redis_uuid_lookup.php
          php -l research/build_candidate.php
          php -l research/regression.php
          php -l research/measure_method.php
          php research/build_candidate.php build/upstream-Feed.php
          php -l build/extracted.php
      - name: Exact method behavior regression
        run: php research/regression.php
      - name: Measure extracted MISP method
        run: |
          mkdir -p results
          php research/measure_method.php | tee results/extracted-method-measurement.json
      - name: Run synthetic scenarios
        run: |
          mkdir -p results
          for scenario in "100 5" "1000 10" "1000 25" "5000 5"; do
            set -- $scenario
            HASHES=$1 SOURCES=$2 php benchmarks/redis_uuid_lookup.php | tee "results/redis-${1}-${2}.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-redis-benchmark
          path: results/
          if-no-files-found: warn
          retention-days: 7
