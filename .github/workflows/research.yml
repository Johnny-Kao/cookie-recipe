name: Independent Redis UUID lookup research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        datastore: [redis:7-alpine, valkey/valkey:7.2]
    services:
      redis:
        image: ${{ matrix.datastore }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP Redis extension
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-redis
      - name: Fetch pinned upstream source (read only)
        run: |
          mkdir -p build
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/MISP/MISP/04fc5f8b7ccb52bb6614ca3e9ccdbfdf6585d985/app/Model/Feed.php \
            -o build/upstream-Feed.php
          test "$(git hash-object build/upstream-Feed.php)" = 1f6a9d8ab8b197a366e549333736a321348d8ed7
      - name: Validate and build independent candidate
        run: |
          php -l benchmarks/redis_uuid_lookup.php
          php -l research/build_candidate.php
          php -l research/regression.php
          php -l research/measure_method.php
          php -l research/concurrency.php
          php -l research/benchmark_attachment.php
          php -l research/property_cases.php
          php -l research/redis_membership_batch_probe.php
          php -l research/build_batch_candidate.php
          php -l research/build_freetext_candidate.php
          php -l research/test_freetext.php
          php -l research/freetext_edge_tests.php
          php -l research/freetext_concurrency_tests.php
          php -l research/freetext_error_tests.php
          php research/build_candidate.php build/upstream-Feed.php
          php -l build/extracted.php
      - name: Exact method behavior regression
        run: php research/regression.php
      - name: Randomized behavioral equivalence
        run: php research/property_cases.php
      - name: Strict concurrency and Redis command-order equivalence
        run: php research/concurrency.php
      - name: Measure extracted MISP method
        run: |
          mkdir -p results
          php research/measure_method.php | tee results/extracted-method-measurement.json
      - name: Repeated PHP-side attachment benchmark
        run: php research/benchmark_attachment.php | tee results/attachment-benchmark.json
      - name: Investigate Redis membership batching only (no patch)
        run: php research/redis_membership_batch_probe.php | tee results/membership-batch-probe.json
      - name: Build and compare batched membership research candidate
        run: |
          php research/build_batch_candidate.php build/upstream-Feed.php
          php -l build/batch-extracted.php
          MISP_EXTRACTED=batch-extracted.php php research/regression.php
          MISP_EXTRACTED=batch-extracted.php php research/property_cases.php
          MISP_EXTRACTED=batch-extracted.php php research/measure_method.php | tee results/membership-method-benchmark.json
      - name: Freetext correlation research regression and timing
        run: |
          php research/build_freetext_candidate.php build/upstream-Feed.php
          php -l build/freetext-extracted.php
          set -o pipefail
          php research/test_freetext.php | tee results/freetext-research.log
          php research/freetext_edge_tests.php | tee results/freetext-edge.log
          php research/freetext_concurrency_tests.php | tee results/freetext-concurrency.log
          php research/freetext_error_tests.php | tee results/freetext-faults.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-redis-benchmark-${{ strategy.job-index }}
          path: results/
          if-no-files-found: warn
          retention-days: 7
