name: MISP independent optimization screening
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source and PHP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli
          mkdir -p build
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/MISP/MISP/04fc5f8b7ccb52bb6614ca3e9ccdbfdf6585d985/app/Model/Warninglist.php \
            -o build/Warninglist.php
          test "$(git hash-object build/Warninglist.php)" = efc62f9cd70cb5a2d8d1e7fac5f9f668ba27e565
      - name: Isolated source-derived Warninglist screen
        run: |
          php -l research/screen_warninglist_hostname.php
          php research/screen_warninglist_hostname.php build/Warninglist.php
