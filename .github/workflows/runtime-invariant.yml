name: MISP runtime invariant research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin MISP Sighting source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli
          mkdir -p build
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/MISP/MISP/04fc5f8b7ccb52bb6614ca3e9ccdbfdf6585d985/app/Model/Sighting.php \
            -o build/Sighting.php
          test "$(git hash-object build/Sighting.php)" = 27d6da3ed1a1ebe09b87add98c19ba3c07c35a11
      - name: Reproduce return-contract and empty-result failure
        run: |
          php -l research/sighting_runtime_invariant.php
          php research/sighting_runtime_invariant.php build/Sighting.php
